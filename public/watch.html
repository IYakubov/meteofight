<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Rock Drift — Watch</title>
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a1c; --bg2:#0d1030; --panel:#11143a; --border:#2c3170;
  --accent:#4fd8ff; --accent2:#ff4fd8; --gold:#ffd24f; --text:#d7dcff; --textdim:#7d83b8;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;user-select:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#topbar{width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);padding:10px 20px;border-bottom:1px solid var(--border)}
.game-title{font-family:'Baloo 2',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.stat{font-family:'Baloo 2',sans-serif;font-size:.85rem;font-weight:700;color:var(--gold)}
.stat span{color:var(--textdim);font-size:.6rem;letter-spacing:.04em;margin-right:5px}
.stat .p1{color:var(--accent);font-size:.85rem;margin:0}
.stat .p2{color:var(--accent2);font-size:.85rem;margin:0}

#arena{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg) 70%)}
canvas{display:block;position:absolute;top:0;left:0}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,10,28,.95);z-index:50;padding:20px;text-align:center}
.screen.hidden{display:none}
.screen.light{background:rgba(8,10,28,.6)}
.screen-title{font-family:'Baloo 2',sans-serif;font-size:1.6rem;font-weight:800;color:var(--accent)}
.screen-sub{font-size:.85rem;color:var(--textdim);max-width:420px;line-height:1.6}
.room-code{font-family:'Baloo 2',sans-serif;font-size:2rem;font-weight:800;letter-spacing:.2em;color:var(--accent2)}
</style>
</head>
<body>

<div id="topbar">
  <div class="game-title">Rock Drift — Spectating</div>
  <div style="display:flex;gap:18px;flex-wrap:wrap" id="stats"></div>
</div>

<div id="arena">
  <canvas id="c"></canvas>
  <div class="screen" id="screen-connecting">
    <div class="screen-title">Connecting...</div>
  </div>
  <div class="screen hidden" id="screen-lobby">
    <div class="screen-title">Waiting for launch</div>
    <div class="screen-sub">The pilots are still connecting or calibrating.</div>
    <div class="room-code" id="room-code-display"></div>
  </div>
  <div class="screen hidden light" id="screen-over">
    <div class="screen-title" id="over-title"></div>
    <div class="screen-sub">Waiting for the next round to start on the big screen.</div>
  </div>
  <div class="screen hidden light" id="screen-paused">
    <div class="screen-title" style="color:#ff5f6d">Paused</div>
    <div class="screen-sub">A pilot lost their connection. Waiting for them to rejoin.</div>
  </div>
  <div class="screen hidden" id="screen-error">
    <div class="screen-title" id="error-title">Something went wrong</div>
  </div>
</div>

<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let AW=800,AH=600;
function resizeCanvas(){
  const a=document.getElementById('arena');
  AW=a.clientWidth;AH=a.clientHeight;
  canvas.width=AW;canvas.height=AH;
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

const SHIP_R=22;
const COL={A:{c:'#4fd8ff',rgb:'79,216,255'},B:{c:'#ff4fd8',rgb:'255,79,216'}};
const SLOT_COL=[COL.A,COL.B];

let state=null;
let stars=[];
function initStars(){
  stars=[];
  const n=Math.round((AW*AH)/9000);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*AW,y:Math.random()*AH,z:.3+Math.random()*1.4,r:.6+Math.random()*1.6});
}
initStars();
window.addEventListener('resize',initStars);

// same outline generator as the host page, so asteroids look identical
function rockShape(seed,n){
  let a=seed>>>0;const out=[];
  for(let i=0;i<n;i++){
    a=(a+0x6D2B79F5)>>>0;
    let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    out.push(.78+(((t^(t>>>14))>>>0)/4294967296)*.3);
  }
  return out;
}
const shapeCache=new Map();
function shapeFor(seed){
  let s=shapeCache.get(seed);
  if(!s){ s=rockShape(seed,11); shapeCache.set(seed,s); if(shapeCache.size>200) shapeCache.delete(shapeCache.keys().next().value); }
  return s;
}

function drawRock(r){
  const shape=shapeFor(r.seed);
  ctx.save();
  ctx.translate(r.x,r.y);ctx.rotate(r.rot);
  ctx.beginPath();
  const n=shape.length;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,rr=r.r*shape[i];
    if(i) ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fillStyle='#141845';ctx.fill();
  ctx.strokeStyle='#9aa2ff';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function drawShip(s,multi){
  if(!s.alive) return;
  const col=SLOT_COL[s.slot]||COL.A;
  if(multi){
    ctx.fillStyle=col.c;ctx.font="800 11px 'Baloo 2',sans-serif";ctx.textAlign='center';
    ctx.fillText('P'+(s.slot+1),s.x,s.y-SHIP_R-9);
  }
  if(s.inv>0&&Math.floor(s.inv/90)%2===0) return;
  ctx.save();
  ctx.translate(s.x,s.y);ctx.rotate(s.ang);
  ctx.fillStyle=col.c;
  ctx.beginPath();
  ctx.moveTo(0,-SHIP_R);ctx.lineTo(SHIP_R*0.8,SHIP_R*0.7);ctx.lineTo(0,SHIP_R*0.35);ctx.lineTo(-SHIP_R*0.8,SHIP_R*0.7);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8fbff';
  ctx.beginPath();ctx.arc(0,-SHIP_R*0.15,4.5,0,7);ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,AW,AH);
  for(const st of stars){
    st.y+=st.z*0.7;
    if(st.y>AH){st.y=-4;st.x=Math.random()*AW;}
    ctx.fillStyle='rgba(215,220,255,'+(0.25+st.z*0.35).toFixed(2)+')';
    ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();
  }
  if(!state||!state.w) return;

  // fit the host's arena into this screen, keeping its proportions
  const sc=Math.min(AW/state.w,AH/state.h);
  const ox=(AW-state.w*sc)/2, oy=(AH-state.h*sc)/2;
  ctx.save();
  ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.strokeStyle='#2c3170';ctx.lineWidth=2/sc;ctx.strokeRect(0,0,state.w,state.h);
  ctx.beginPath();ctx.rect(0,0,state.w,state.h);ctx.clip();
  for(const r of(state.rocks||[])) drawRock(r);
  const ships=state.ships||[];
  for(const s of ships) drawShip(s,ships.length>1);
  ctx.restore();
}
function loop(){ draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function fmtTime(ms){
  const s=ms/1000;
  return s<60?s.toFixed(1)+'s':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}
function updateStats(s){
  const el=document.getElementById('stats');
  const ships=s.ships||[];
  if(s.mode==='duo'){
    const hp=i=>ships[i]?ships[i].hp:5;
    el.innerHTML=
      '<div class="stat"><span>ROUND</span>'+(s.round||1)+'</div>'+
      '<div class="stat"><span>SCORE</span><span class="p1">'+(s.scores?s.scores[0]:0)+'</span> : <span class="p2">'+(s.scores?s.scores[1]:0)+'</span></div>'+
      '<div class="stat"><span>WAVE</span>'+(s.wave||1)+'</div>'+
      '<div class="stat"><span>HULL</span><span class="p1">P1 '+hp(0)+'</span> · <span class="p2">P2 '+hp(1)+'</span></div>';
  }else{
    el.innerHTML=
      '<div class="stat"><span>TIME</span>'+fmtTime(s.time||0)+'</div>'+
      '<div class="stat"><span>WAVE</span>'+(s.wave||1)+'</div>'+
      '<div class="stat"><span>HULL</span>'+(ships[0]?ships[0].hp:5)+'</div>';
  }
}

const SCREENS=['screen-connecting','screen-lobby','screen-over','screen-paused','screen-error'];
function showOnly(id){ SCREENS.forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id)); }

const code=new URLSearchParams(window.location.search).get('code');
if(!code||!/^\d{6}$/.test(code)){
  document.getElementById('error-title').textContent='No game code in this link';
  showOnly('screen-error');
}else{
  const socket=io();
  document.getElementById('room-code-display').textContent=code;
  updateStats({mode:'solo',ships:[]});

  socket.on('connect',()=>socket.emit('spectate_join',{code}));
  socket.on('spectate_error',()=>{
    document.getElementById('error-title').textContent='Game not found';
    showOnly('screen-error');
  });
  socket.on('spectate_ok',({mode})=>{ updateStats({mode,ships:[]}); showOnly('screen-lobby'); });

  socket.on('lobby_update',()=>{ /* keeps the lobby screen informative */ });

  socket.on('host_state',s=>{
    state=s;
    updateStats(s);
    if(s.inLobby) showOnly('screen-lobby');
    else if(s.paused) showOnly('screen-paused');
    else if(s.phase==='over'){
      document.getElementById('over-title').textContent=s.title||'Round over';
      showOnly('screen-over');
    }
    else showOnly('');
  });

  socket.on('host_disconnected',()=>{
    document.getElementById('error-title').textContent='The host ended the game';
    showOnly('screen-error');
  });
}
</script>
</body>
</html>
